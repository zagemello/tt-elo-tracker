name: Keep Supabase Warm

on:
  schedule:
    - cron: '0 12 */5 * *'  # every 5 days at noon UTC

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null \
            && echo "Supabase is alive"
